<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" font-family="'DM Sans', 'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22c55e" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="failureGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.12"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowS" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#22c55e"/>
    </marker>
    <marker id="arrowF" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6" fill="#ef4444"/>
    </marker>
    <marker id="arrowD" markerWidth="7" markerHeight="5" refX="7" refY="2.5" orient="auto">
      <path d="M0,0 L7,2.5 L0,5" fill="#ef4444" opacity="0.5"/>
    </marker>
  </defs>

  <!-- Background bands -->
  <rect x="0" y="30" width="820" height="100" rx="8" fill="url(#successGrad)"/>
  <rect x="0" y="140" width="820" height="100" rx="8" fill="url(#failureGrad)"/>

  <!-- Track labels -->
  <text x="16" y="56" font-size="10" font-weight="700" fill="#22c55e" opacity="0.6" letter-spacing="1.2" text-transform="uppercase">SUCCESS TRACK</text>
  <text x="16" y="166" font-size="10" font-weight="700" fill="#ef4444" opacity="0.6" letter-spacing="1.2" text-transform="uppercase">FAILURE TRACK</text>

  <!-- Success track line -->
  <line x1="30" y1="90" x2="758" y2="90" stroke="#22c55e" stroke-width="3" stroke-linecap="round" marker-end="url(#arrowS)"/>

  <!-- Failure track line (dashed) -->
  <line x1="30" y1="200" x2="758" y2="200" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="10,5" marker-end="url(#arrowF)"/>

  <!-- Switch paths — vertical dashed lines from each node down to failure track -->
  <path d="M175,112 L175,192" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,4" opacity="0.35" marker-end="url(#arrowD)"/>
  <path d="M315,112 L315,192" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,4" opacity="0.35" marker-end="url(#arrowD)"/>
  <path d="M455,112 L455,192" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,4" opacity="0.35" marker-end="url(#arrowD)"/>
  <path d="M595,112 L595,192" stroke="#ef4444" stroke-width="1.5" fill="none" stroke-dasharray="3,4" opacity="0.35" marker-end="url(#arrowD)"/>

  <!-- Operation nodes (pill shape, green border, semi-transparent fill) -->
  <rect x="115" y="68" width="120" height="44" rx="22" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2"/>
  <text x="175" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#22c55e">Validate</text>

  <rect x="255" y="68" width="120" height="44" rx="22" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2"/>
  <text x="315" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#22c55e">Bind</text>

  <rect x="395" y="68" width="120" height="44" rx="22" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2"/>
  <text x="455" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#22c55e">Map</text>

  <rect x="535" y="68" width="120" height="44" rx="22" fill="#22c55e" fill-opacity="0.08" stroke="#22c55e" stroke-width="2"/>
  <text x="595" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#22c55e">Execute</text>

  <!-- Start node -->
  <circle cx="50" cy="90" r="15" fill="#22c55e" filter="url(#glow)"/>
  <polygon points="46,83 46,97 57,90" fill="#fff"/>

  <!-- End: Success pill -->
  <rect x="770" y="74" width="42" height="32" rx="16" fill="#22c55e"/>
  <text x="791" y="95" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">OK</text>

  <!-- End: Failure pill -->
  <rect x="770" y="184" width="42" height="32" rx="16" fill="#ef4444"/>
  <text x="791" y="205" text-anchor="middle" font-size="10" font-weight="700" fill="#fff">ERR</text>

  <!-- "skip" labels on failure track -->
  <text x="175" y="222" text-anchor="middle" font-size="9.5" fill="#ef4444" opacity="0.45" font-style="italic">skip</text>
  <text x="315" y="222" text-anchor="middle" font-size="9.5" fill="#ef4444" opacity="0.45" font-style="italic">skip</text>
  <text x="455" y="222" text-anchor="middle" font-size="9.5" fill="#ef4444" opacity="0.45" font-style="italic">skip</text>
  <text x="595" y="222" text-anchor="middle" font-size="9.5" fill="#ef4444" opacity="0.45" font-style="italic">skip</text>

  <!-- Annotation -->
  <text x="410" y="252" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Once on the failure track, subsequent operations are bypassed</text>
</svg>
